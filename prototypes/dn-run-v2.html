<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DN Run V2</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #wrap { position: relative; max-width: 100vw; max-height: 100vh; line-height: 0; }
  canvas {
    background: #0a0e1a;
    display: block;
    image-rendering: pixelated;
    border: 4px solid #111;
    max-width: 100vw; max-height: 100vh;
    width: auto; height: auto;
    touch-action: none;
  }
  #hud {
    position: absolute; top: 8px; left: 12px; right: 12px;
    color: #fff; font-size: 16px; text-shadow: 2px 2px #000;
    display: flex; justify-content: space-between;
    pointer-events: none;
  }
  #msgWrap {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; display: none;
    display: none; flex-direction: column; align-items: center; gap: 14px;
  }
  #msg { color: #fff; font-size: 24px; text-shadow: 3px 3px #000; }
  #restartBtn {
    display: none;
    font-family: 'Courier New', monospace;
    font-size: 18px; font-weight: bold;
    padding: 12px 28px;
    background: linear-gradient(180deg, #4dfff0, #17c9b8);
    color: #062824; border: 3px solid #fff; border-radius: 8px;
    cursor: pointer; pointer-events: auto;
    box-shadow: 0 4px 0 #0a6e63;
  }
  #restartBtn:active { transform: translateY(3px); box-shadow: none; }
  #help { color: #ddd; font-size: 13px; text-align: center; margin-top: 8px; }
  body.touch-mode #help { display: none; }

  /* ---- Character select screen ---- */
  #selectScreen {
    position: absolute; inset: 0; z-index: 50;
    background: radial-gradient(ellipse at center, #14213d 0%, #05070f 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; gap: 22px;
  }
  #selectTitle { font-size: 28px; letter-spacing: 2px; text-shadow: 3px 3px #000; }
  #selectTitle span { color: #4dfff0; }
  #cards { display: flex; gap: 28px; }
  .card {
    width: 150px; padding: 14px 10px; border-radius: 10px;
    background: rgba(255,255,255,0.06);
    border: 3px solid rgba(255,255,255,0.25);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    cursor: pointer; pointer-events: auto;
    transition: transform 0.1s, border-color 0.15s, background 0.15s;
  }
  .card:hover, .card.selected { border-color: #ffe14d; background: rgba(255,225,77,0.12); transform: translateY(-4px); }
  .card canvas { image-rendering: pixelated; }
  .card .name { font-size: 15px; font-weight: bold; }
  .card .desc { font-size: 11px; color: #bbb; text-align: center; line-height: 1.4; }
  #selectHint { font-size: 12px; color: #999; }
</style>
</head>
<body>
<div>
  <div id="wrap">
    <canvas id="game" width="768" height="432"></canvas>
    <div id="hud">
      <div id="score">SCORE: 0</div>
      <div id="shards">SHARDS: 0</div>
      <div id="lives">LIVES: 3</div>
      <div id="muteBtn" style="pointer-events:auto; cursor:pointer; font-size:20px;">🔊</div>
    </div>
    <div id="msgWrap">
      <div id="msg"></div>
      <button id="restartBtn">↻ RESTART</button>
    </div>

    <div id="touchControls" style="display:none; position:absolute; inset:0; pointer-events:none;">
      <div class="touch-zone" id="dpad" style="position:absolute; left:14px; bottom:14px; display:flex; gap:10px; pointer-events:none;">
        <div class="btn" id="leftBtn">◀</div>
        <div class="btn" id="rightBtn">▶</div>
      </div>
      <div class="touch-zone" id="actions" style="position:absolute; right:14px; bottom:14px; display:flex; gap:10px; pointer-events:none;">
        <div class="btn" id="jumpBtn">JUMP</div>
      </div>
    </div>

    <div id="selectScreen">
      <div id="selectTitle">D N &nbsp;R U N &nbsp;<span>V2</span></div>
      <div id="cards">
        <div class="card" id="card0">
          <canvas width="72" height="72" id="thumb0"></canvas>
          <div class="name">NOVA</div>
          <div class="desc">Balanced &amp; steady.<br>Cyan energy core.</div>
        </div>
        <div class="card" id="card1">
          <canvas width="72" height="72" id="thumb1"></canvas>
          <div class="name">RYDER</div>
          <div class="desc">Quick off the mark.<br>Magenta energy core.</div>
        </div>
      </div>
      <div id="selectHint">Tap a character, or use ◀ ▶ and ENTER</div>
    </div>
  </div>
  <div id="help">← → move · SPACE / ↑ jump (hold for higher jump) · R restart</div>
</div>

<style>
  .btn {
    width: 62px; height: 62px; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.55);
    color: #fff; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; -webkit-user-select: none; user-select: none; touch-action: none;
  }
  .btn.pressed { background: rgba(255,255,255,0.5); }
  #jumpBtn { width: 78px; height: 78px; font-size: 14px; font-weight: bold; }
  body.touch-mode #touchControls { display: block !important; }
  #rotatePrompt {
    display: none; position: fixed; inset: 0; background: #000; color: #fff; z-index: 999;
    flex-direction: column; align-items: center; justify-content: center;
    font-size: 18px; text-align: center; gap: 12px;
  }
  body.touch-mode.portrait #rotatePrompt { display: flex; }
  body.touch-mode.portrait #wrap { display: none; }
</style>
<div id="rotatePrompt">
  <div style="font-size:42px;">⟳</div>
  <div>Rotate your phone sideways<br>to play</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const TILE = 32;
const GRAVITY = 0.6;
const FRICTION = 0.82;

// ---------- Character definitions (cosmetic + tiny flavor stat) ----------
const CHARACTERS = [
  { name: 'NOVA',  body: '#4dfff0', accent: '#0aa89a', trail: 'rgba(77,255,240,0.5)', accelMul: 1.0,  jumpMul: 1.0  },
  { name: 'RYDER', body: '#ff4dd2', accent: '#a8107f', trail: 'rgba(255,77,210,0.5)', accelMul: 1.12, jumpMul: 0.96 },
];
let chosenChar = 0;

// draw the little select-screen portraits
function drawThumb(canvasEl, ch) {
  const c = canvasEl.getContext('2d');
  c.clearRect(0,0,72,72);
  c.fillStyle = ch.body;
  c.fillRect(18, 14, 36, 44);
  c.fillStyle = '#fff';
  c.fillRect(40, 24, 8, 8);
  c.fillStyle = ch.accent;
  c.fillRect(18, 14, 36, 8);
  c.fillRect(18, 50, 36, 8);
}
drawThumb(document.getElementById('thumb0'), CHARACTERS[0]);
drawThumb(document.getElementById('thumb1'), CHARACTERS[1]);

let selectHighlight = 0;
function refreshCardHighlight() {
  document.getElementById('card0').classList.toggle('selected', selectHighlight === 0);
  document.getElementById('card1').classList.toggle('selected', selectHighlight === 1);
}
refreshCardHighlight();

function chooseCharacter(idx) {
  chosenChar = idx;
  document.getElementById('selectScreen').style.display = 'none';
  primeAudio();
  gameActive = true;
}
document.getElementById('card0').addEventListener('pointerdown', () => chooseCharacter(0));
document.getElementById('card1').addEventListener('pointerdown', () => chooseCharacter(1));

// ---------- Level data ----------
// . empty | G ground | B crate | Q core-block(score+shard) | L life-core(gives extra life)
// P/p pylon | C shard | E crawler enemy | D drone enemy | S start | F portal(goal)
const levelStr = [
"................................................................................................",
"................................................................................................",
"................................................................................................",
"..............................CCC...............................................................",
".....Q...........................................................CCC............................",
"............................D.....................CCC.................D.........................",
".......BBQB......L............................................BQBB..............................",
"..............E........................................E..................................F.....",
".S............................................PP..........................................F.....",
"GGGGGGGGGGGGGGGGGGGGGG...GGGGGGGGGGGGGGG...GGGppGGGGGGGGGG...GGGGGGGGGGGGG...GGGGGGGGGGGGGGGGGGG",
"GGGGGGGGGGGGGGGGGGGGGG...GGGGGGGGGGGGGGG...GGGGGGGGGGGGGGG...GGGGGGGGGGGGG...GGGGGGGGGGGGGGGGGGG",
];

const level = levelStr.map(row => row.split(''));
const LEVEL_W = level[0].length * TILE;
const LEVEL_H = level.length * TILE;

let solids = [];
let shardsList = [];
let enemies = [];
let orbs = []; // life orbs popped from L blocks
let flagX = null;

function buildLevel() {
  solids = []; shardsList = []; enemies = []; orbs = []; flagX = null;
  for (let r = 0; r < level.length; r++) {
    for (let c = 0; c < level[r].length; c++) {
      const ch = level[r][c];
      const x = c * TILE, y = r * TILE;
      if (ch === 'G') solids.push({x, y, w: TILE, h: TILE, type: 'ground'});
      else if (ch === 'B') solids.push({x, y, w: TILE, h: TILE, type: 'crate'});
      else if (ch === 'Q') solids.push({x, y, w: TILE, h: TILE, type: 'core', hit: false});
      else if (ch === 'L') solids.push({x, y, w: TILE, h: TILE, type: 'lifecore', hit: false});
      else if (ch === 'P' || ch === 'p') solids.push({x, y, w: TILE, h: TILE, type: 'pylon'});
      else if (ch === 'C') shardsList.push({x: x + 8, y: y + 8, w: 16, h: 16, taken: false});
      else if (ch === 'E') enemies.push(makeCrawler(x, y));
      else if (ch === 'D') enemies.push(makeDrone(x, y));
      else if (ch === 'S') { player.startX = x; player.startY = y; }
      else if (ch === 'F') { if (flagX === null) flagX = x; }
    }
  }
}

function makeCrawler(x, y) {
  return { kind:'crawler', x, y, w: 28, h: 28, vx: -1.2, vy: 0, alive: true, squished: false, squishTimer: 0 };
}
function makeDrone(x, y) {
  return { kind:'drone', x, y, baseY: y, w: 26, h: 22, vx: -1.5, alive: true, squished: false, squishTimer: 0, t: Math.random()*100 };
}

// ---------- Player ----------
const player = {
  x: 0, y: 0, w: 24, h: 30,
  vx: 0, vy: 0,
  onGround: false,
  facing: 1,
  startX: 32, startY: 32 * 7,
  invuln: 0,
};

let score = 0, shardCount = 0, lives = 3;
let camX = 0;
let gameState = 'playing';
let gameActive = false; // becomes true after character select
let keys = {};

document.addEventListener('keydown', e => {
  if (!gameActive) {
    if (e.code === 'ArrowLeft') { selectHighlight = 0; refreshCardHighlight(); }
    if (e.code === 'ArrowRight') { selectHighlight = 1; refreshCardHighlight(); }
    if (e.code === 'Enter' || e.code === 'Space') chooseCharacter(selectHighlight);
    return;
  }
  keys[e.code] = true;
  if (e.code === 'KeyR') resetAll();
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.code] = false);

function resetPlayerPos() {
  player.x = player.startX;
  player.y = player.startY;
  player.vx = 0; player.vy = 0;
  player.invuln = 90;
}

function resetAll() {
  score = 0; shardCount = 0; lives = 3;
  gameState = 'playing';
  document.getElementById('msgWrap').style.display = 'none';
  document.getElementById('restartBtn').style.display = 'none';
  buildLevel();
  resetPlayerPos();
  if (audioCtx) startMusic();
}
document.getElementById('restartBtn').addEventListener('pointerdown', e => { e.stopPropagation(); resetAll(); });

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

let popShards = [];
function spawnPopShard(x, y) {
  popShards.push({x: x + 8, y: y, w: 16, h: 16, vy: -6, life: 30});
}
function spawnOrb(x, y) {
  orbs.push({x: x + 6, y: y, w: 20, h: 20, vy: -5, life: 90, taken: false});
}

function aabbResolve(entity) {
  entity.onGround = false;
  entity.x += entity.vx;
  for (const s of solids) {
    if (rectsOverlap(entity, s)) {
      if (entity.vx > 0) entity.x = s.x - entity.w;
      else if (entity.vx < 0) entity.x = s.x + s.w;
      entity.vx = 0;
    }
  }
  entity.y += entity.vy;
  for (const s of solids) {
    if (rectsOverlap(entity, s)) {
      if (entity.vy > 0) {
        entity.y = s.y - entity.h;
        entity.vy = 0;
        entity.onGround = true;
      } else if (entity.vy < 0) {
        entity.y = s.y + s.h;
        entity.vy = 0;
        if ((s.type === 'core' || s.type === 'lifecore') && !s.hit) {
          s.hit = true;
          if (s.type === 'core') {
            score += 100;
            spawnPopShard(s.x, s.y);
            sfx.block();
          } else {
            spawnOrb(s.x, s.y);
            sfx.block();
          }
        }
      }
    }
  }
}

function updatePlayer() {
  if (gameState !== 'playing') return;
  const ch = CHARACTERS[chosenChar];
  const speed = 3.2;
  if (keys['ArrowLeft']) { player.vx -= 0.6 * ch.accelMul; player.facing = -1; }
  if (keys['ArrowRight']) { player.vx += 0.6 * ch.accelMul; player.facing = 1; }
  player.vx *= FRICTION;
  if (Math.abs(player.vx) > speed) player.vx = speed * Math.sign(player.vx);
  if (Math.abs(player.vx) < 0.05) player.vx = 0;

  if ((keys['Space'] || keys['ArrowUp']) && player.onGround) {
    player.vy = -11.5 * ch.jumpMul;
    player.onGround = false;
    sfx.jump();
  }
  if (!(keys['Space'] || keys['ArrowUp']) && player.vy < -4) player.vy = -4;

  player.vy += GRAVITY;
  if (player.vy > 15) player.vy = 15;

  aabbResolve(player);
  if (player.x < 0) player.x = 0;
  if (player.invuln > 0) player.invuln--;

  if (player.y > LEVEL_H + 100) killPlayer();

  for (const c of shardsList) {
    if (!c.taken && rectsOverlap(player, c)) {
      c.taken = true;
      shardCount++;
      score += 50;
      sfx.coin();
    }
  }
  for (const o of orbs) {
    if (!o.taken && rectsOverlap(player, o)) {
      o.taken = true;
      lives++;
      score += 150;
      sfx.powerup();
    }
  }

  if (flagX !== null && player.x + player.w > flagX && gameState === 'playing') {
    gameState = 'win';
    stopMusic();
    sfx.win();
    showMsg('LEVEL CLEAR!  Score: ' + score, true);
  }
}

function killPlayer() {
  if (player.invuln > 0) return;
  if (gameState !== 'playing') return;
  lives--;
  sfx.death();
  if (lives <= 0) {
    gameState = 'over';
    stopMusic();
    setTimeout(sfx.gameover, 200);
    showMsg('GAME OVER — Score: ' + score, true);
  } else {
    resetPlayerPos();
  }
}

function showMsg(text, showRestart) {
  const m = document.getElementById('msg');
  m.textContent = text;
  document.getElementById('msgWrap').style.display = 'flex';
  document.getElementById('restartBtn').style.display = showRestart ? 'inline-block' : 'none';
}

function updateEnemies() {
  for (const en of enemies) {
    if (!en.alive) continue;
    if (en.squished) {
      en.squishTimer--;
      if (en.squishTimer <= 0) en.alive = false;
      continue;
    }
    if (en.kind === 'crawler') {
      en.vy = (en.vy || 0) + GRAVITY;
      if (en.vy > 15) en.vy = 15;
      const nextX = en.x + en.vx;
      let willHitWall = false;
      for (const s of solids) if (rectsOverlap({x: nextX, y: en.y, w: en.w, h: en.h}, s)) willHitWall = true;
      if (willHitWall) en.vx *= -1; else en.x = nextX;
      en.y += en.vy;
      en.onGround = false;
      for (const s of solids) {
        if (rectsOverlap(en, s)) {
          if (en.vy > 0) { en.y = s.y - en.h; en.vy = 0; en.onGround = true; }
          else if (en.vy < 0) { en.y = s.y + s.h; en.vy = 0; }
        }
      }
      if (en.onGround) {
        const aheadX = en.vx > 0 ? en.x + en.w + 2 : en.x - 2;
        const footY = en.y + en.h + 2;
        let groundAhead = false;
        for (const s of solids) if (aheadX >= s.x && aheadX <= s.x + s.w && footY >= s.y && footY <= s.y + s.h) groundAhead = true;
        if (!groundAhead) en.vx *= -1;
      }
    } else if (en.kind === 'drone') {
      en.t += 1;
      const nextX = en.x + en.vx;
      let willHitWall = false;
      for (const s of solids) if (rectsOverlap({x: nextX, y: en.y, w: en.w, h: en.h}, s)) willHitWall = true;
      if (willHitWall) en.vx *= -1; else en.x = nextX;
      en.y = en.baseY + Math.sin(en.t * 0.05) * 22;
    }

    if (gameState === 'playing' && player.invuln <= 0 && rectsOverlap(player, en)) {
      const stomping = player.vy > 0 && (player.y + player.h) - en.y < 16;
      if (stomping) {
        en.squished = true;
        en.squishTimer = 20;
        en.h = 10; en.y += (en.kind==='crawler'?18:10);
        player.vy = -7;
        score += 200;
        sfx.stomp();
      } else {
        killPlayer();
      }
    }
  }

  for (const pc of popShards) { pc.y += pc.vy; pc.vy += 0.3; pc.life--; }
  popShards = popShards.filter(pc => pc.life > 0);
  for (const o of orbs) { if (!o.taken) { o.y += o.vy; o.vy += 0.2; if (o.vy > 0) o.vy = 0; } }
}

function update() {
  if (!gameActive) return;
  updatePlayer();
  updateEnemies();
  camX = player.x - canvas.width / 2 + player.w / 2;
  if (camX < 0) camX = 0;
  if (camX > LEVEL_W - canvas.width) camX = LEVEL_W - canvas.width;
}

// ---------- Drawing ----------
function drawTile(s) {
  const sx = s.x - camX;
  if (sx + s.w < 0 || sx > canvas.width) return;
  if (s.type === 'ground') {
    ctx.fillStyle = '#233a5e';
    ctx.fillRect(sx, s.y, s.w, s.h);
    ctx.fillStyle = '#3d63a3';
    ctx.fillRect(sx, s.y, s.w, 5);
    ctx.strokeStyle = 'rgba(77,255,240,0.15)';
    ctx.strokeRect(sx, s.y, s.w, s.h);
  } else if (s.type === 'crate') {
    ctx.fillStyle = '#5a3d8f';
    ctx.fillRect(sx, s.y, s.w, s.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.strokeRect(sx + 1, s.y + 1, s.w - 2, s.h - 2);
    ctx.beginPath();
    ctx.moveTo(sx + s.w/2, s.y); ctx.lineTo(sx + s.w/2, s.y + s.h);
    ctx.moveTo(sx, s.y + s.h/2); ctx.lineTo(sx + s.w, s.y + s.h/2);
    ctx.stroke();
  } else if (s.type === 'core' || s.type === 'lifecore') {
    ctx.fillStyle = s.hit ? '#333' : (s.type === 'core' ? '#ffe14d' : '#ff4dd2');
    ctx.fillRect(sx, s.y, s.w, s.h);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.strokeRect(sx + 1, s.y + 1, s.w - 2, s.h - 2);
    if (!s.hit) {
      ctx.fillStyle = '#111';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(s.type === 'core' ? '◆' : '♥', sx + s.w/2, s.y + s.h/2 + 6);
    }
  } else if (s.type === 'pylon') {
    ctx.fillStyle = '#0aa89a';
    ctx.fillRect(sx, s.y, s.w, s.h);
    ctx.strokeStyle = '#4dfff0';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 2, s.y + 2, s.w - 4, s.h - 4);
  }
}

function drawShard(c, drawX) {
  ctx.save();
  ctx.translate(drawX + c.w/2, c.y + c.h/2);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle = '#4dfff0';
  ctx.fillRect(-c.w/2.6, -c.h/2.6, c.w/1.3, c.h/1.3);
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(-c.w/2.6, -c.h/2.6, c.w/1.3, c.h/1.3);
  ctx.restore();
}

function drawOrb(o) {
  const sx = o.x - camX;
  ctx.fillStyle = '#ff4dd2';
  ctx.beginPath();
  ctx.arc(sx + o.w/2, o.y + o.h/2, o.w/2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('♥', sx + o.w/2, o.y + o.h/2 + 4);
}

function drawCrawler(en) {
  const sx = en.x - camX;
  if (sx + en.w < 0 || sx > canvas.width) return;
  ctx.fillStyle = en.squished ? '#4a1f66' : '#8a3ffc';
  ctx.beginPath();
  ctx.ellipse(sx + en.w/2, en.y + en.h/2, en.w/2, en.h/2, 0, 0, Math.PI*2);
  ctx.fill();
  if (!en.squished) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx + 5, en.y + 8, 5, 5);
    ctx.fillRect(sx + en.w - 10, en.y + 8, 5, 5);
    ctx.fillStyle = '#ff4dd2';
    ctx.fillRect(sx + 6, en.y + 9, 2, 2);
    ctx.fillRect(sx + en.w - 9, en.y + 9, 2, 2);
  }
}
function drawDrone(en) {
  const sx = en.x - camX;
  if (sx + en.w < 0 || sx > canvas.width) return;
  ctx.fillStyle = en.squished ? '#333' : '#ff6b4d';
  ctx.beginPath();
  ctx.ellipse(sx + en.w/2, en.y + en.h/2, en.w/2, en.h/2.6, 0, 0, Math.PI*2);
  ctx.fill();
  if (!en.squished) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(sx + en.w/2, en.y + en.h/2, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,107,77,0.5)';
    ctx.beginPath(); ctx.moveTo(sx+4, en.y+en.h); ctx.lineTo(sx+4, en.y+en.h+8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+en.w-4, en.y+en.h); ctx.lineTo(sx+en.w-4, en.y+en.h+8); ctx.stroke();
  }
}

function drawPlayer() {
  const ch = CHARACTERS[chosenChar];
  const sx = player.x - camX;
  if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) return;
  ctx.fillStyle = ch.body;
  ctx.fillRect(sx, player.y, player.w, player.h);
  ctx.fillStyle = ch.accent;
  ctx.fillRect(sx, player.y, player.w, 8);
  ctx.fillRect(sx, player.y + player.h - 8, player.w, 8);
  ctx.fillStyle = '#fff';
  const eyeX = player.facing > 0 ? sx + player.w - 8 : sx + 4;
  ctx.fillRect(eyeX, player.y + 10, 4, 4);
}

function drawFlag() {
  if (flagX === null) return;
  const sx = flagX - camX;
  ctx.fillStyle = '#888';
  ctx.fillRect(sx + 14, 0, 4, LEVEL_H);
  ctx.save();
  ctx.globalAlpha = 0.85;
  const pulse = 24 + Math.sin(Date.now()/150)*4;
  ctx.fillStyle = '#4dfff0';
  ctx.beginPath();
  ctx.arc(sx + 18, 55, pulse, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawBG() {
  const grd = ctx.createLinearGradient(0,0,0,canvas.height);
  grd.addColorStop(0, '#0a0e2a');
  grd.addColorStop(1, '#141a3d');
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(77,255,240,0.06)';
  const off = camX * 0.3 % 40;
  for (let x = -off; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
}

function draw() {
  drawBG();
  for (const s of solids) drawTile(s);
  drawFlag();
  for (const c of shardsList) if (!c.taken) drawShard(c, c.x - camX);
  for (const pc of popShards) drawShard(pc, pc.x - camX);
  for (const o of orbs) if (!o.taken) drawOrb(o);
  for (const en of enemies) if (en.alive) { if (en.kind === 'crawler') drawCrawler(en); else drawDrone(en); }
  if (gameActive) drawPlayer();

  document.getElementById('score').textContent = 'SCORE: ' + score;
  document.getElementById('shards').textContent = 'SHARDS: ' + shardCount;
  document.getElementById('lives').textContent = 'LIVES: ' + lives;
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// ---------- Touch controls ----------
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouchDevice) document.body.classList.add('touch-mode');
function updateOrientation() {
  const portrait = window.innerHeight > window.innerWidth;
  document.body.classList.toggle('portrait', portrait && isTouchDevice);
}
updateOrientation();
window.addEventListener('resize', updateOrientation);
window.addEventListener('orientationchange', updateOrientation);

function bindButton(el, codes) {
  let activePointerId = null;
  const press = (e) => {
    if (!gameActive) return;
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    el.setPointerCapture(activePointerId);
    el.classList.add('pressed');
    codes.forEach(c => keys[c] = true);
    e.preventDefault();
  };
  const release = (e) => {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    el.classList.remove('pressed');
    codes.forEach(c => keys[c] = false);
    e.preventDefault();
  };
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindButton(document.getElementById('leftBtn'), ['ArrowLeft']);
bindButton(document.getElementById('rightBtn'), ['ArrowRight']);
bindButton(document.getElementById('jumpBtn'), ['Space', 'ArrowUp']);

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// ---------- 8-bit Audio Engine ----------
let audioCtx = null, masterGain, sfxGain, musicGain;
let musicOn = true, musicStarted = false;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0.9;
  sfxGain = audioCtx.createGain(); sfxGain.gain.value = 0.5;
  musicGain = audioCtx.createGain(); musicGain.gain.value = 0.2;
  sfxGain.connect(masterGain); musicGain.connect(masterGain); masterGain.connect(audioCtx.destination);
}
function beep(freq, dur, type='square', vol=1, when=0, slideTo=null) {
  if (!audioCtx || !musicOn) return;
  const t0 = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(slideTo,1), t0+dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(g); g.connect(sfxGain);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function noiseBurst(dur, vol=1, when=0) {
  if (!audioCtx || !musicOn) return;
  const t0 = audioCtx.currentTime + when;
  const bufSize = audioCtx.sampleRate*dur;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i=0;i<bufSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufSize);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  src.connect(g); g.connect(sfxGain); src.start(t0);
}
const sfx = {
  jump: () => beep(420, 0.16, 'square', 0.5, 0, 900),
  coin: () => { beep(988, 0.09, 'square', 0.45); beep(1568, 0.18, 'square', 0.4, 0.09); },
  stomp: () => noiseBurst(0.12, 0.5),
  block: () => beep(660, 0.08, 'square', 0.4, 0, 440),
  powerup: () => { [523,659,784,1047,1319].forEach((f,i) => beep(f, 0.12, 'square', 0.45, i*0.09)); },
  death: () => { beep(392, 0.15, 'triangle', 0.5, 0, 220); beep(220, 0.3, 'triangle', 0.4, 0.15, 80); },
  win: () => { [523,523,523,659,784,784,880,1047].forEach((f,i) => beep(f, 0.14, 'square', 0.4, i*0.13)); },
  gameover: () => { [392,349,330,262].forEach((f,i) => beep(f, 0.3, 'triangle', 0.4, i*0.28)); },
};

const TEMPO = 140;
const STEP = 60 / TEMPO / 4;
const leadPattern = [
  587,0,698,0, 880,0,698,0, 587,0,698,0, 880,0,1175,0,
  1046,0,880,0, 698,0,880,0, 587,0,440,0, 494,0,523,0,
];
const bassPattern = [
  294,0,0,0, 294,0,0,0, 220,0,0,0, 220,0,0,0,
  247,0,0,0, 247,0,0,0, 185,0,0,0, 220,0,0,0,
];
let musicStep = 0, nextNoteTime = 0, musicTimerId = null;
function scheduleMusicStep() {
  const lf = leadPattern[musicStep % leadPattern.length];
  const bf = bassPattern[musicStep % bassPattern.length];
  const when = Math.max(0, nextNoteTime - audioCtx.currentTime);
  if (lf) beep(lf, STEP*0.85, 'square', 0.2, when);
  if (bf) beep(bf, STEP*0.9, 'triangle', 0.28, when);
  nextNoteTime += STEP; musicStep++;
}
function musicLoop() {
  if (!audioCtx) return;
  while (nextNoteTime < audioCtx.currentTime + 0.1) scheduleMusicStep();
  musicTimerId = setTimeout(musicLoop, 25);
}
function startMusic() {
  musicStarted = true; nextNoteTime = audioCtx.currentTime + 0.05; musicStep = 0;
  musicLoop();
}
function stopMusic() { musicStarted = false; if (musicTimerId) clearTimeout(musicTimerId); }
function toggleMusic() {
  musicOn = !musicOn;
  document.getElementById('muteBtn').textContent = musicOn ? '🔊' : '🔇';
  if (audioCtx) masterGain.gain.value = musicOn ? 0.9 : 0;
}
function primeAudio() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  startMusic();
}
document.getElementById('muteBtn').addEventListener('click', e => { e.stopPropagation(); toggleMusic(); });
document.getElementById('muteBtn').addEventListener('pointerdown', e => e.stopPropagation());

buildLevel();
resetPlayerPos();
loop();
</script>
