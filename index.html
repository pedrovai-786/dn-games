<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DN Games</title>
<style>
  :root {
    --bg: #0e0f13;
    --card: #191b22;
    --card-hover: #21242e;
    --text: #f2f3f7;
    --muted: #8f95a6;
    --accent: #4ade80;
    --border: #2a2e3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: clamp(1.75rem, 6vw, 2.5rem);
    margin: 0 0 .35rem;
    letter-spacing: -0.02em;
  }
  .sub { color: var(--muted); margin: 0 0 2.5rem; }
  .grid { display: grid; gap: .75rem; }
  a.game {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.1rem 1.25rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: inherit;
    text-decoration: none;
    transition: background .15s ease, transform .15s ease;
  }
  a.game:active { transform: scale(.985); }
  @media (hover: hover) {
    a.game:hover { background: var(--card-hover); }
  }
  .name { font-weight: 600; font-size: 1.05rem; }
  .desc { color: var(--muted); font-size: .875rem; margin-top: .15rem; }
  .play { color: var(--accent); font-size: .875rem; font-weight: 600; white-space: nowrap; }
  footer { color: var(--muted); font-size: .8125rem; margin-top: 3rem; text-align: center; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>DN Games</h1>
  <p class="sub">Small browser games. Tap one to play — no install, works on mobile.</p>

  <!-- Add one entry per game in games/releases/ -->
  <div class="grid">
    <a class="game" href="releases/plane-dash-v3.html">
      <span>
        <span class="name">Plane.dash</span>
        <span class="desc">Hold to climb, release to dive.</span>
      </span>
      <span class="play">Play →</span>
    </a>
  </div>

  <footer>
    <a href="https://github.com/pedrovai-786/dn-games">Source on GitHub</a>
  </footer>
</main>
</body>
</html>
